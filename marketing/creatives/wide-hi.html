<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --petrol:#0C3B38; --petrol-deep:#072724; --marigold:#F59E1B; --paper:#F4F3EF; }
  html,body{ background:#0C3B38; }
  .frame{ position:relative; background:var(--petrol); color:var(--paper); overflow:hidden;
    font-family:"Nirmala UI","Segoe UI","Noto Sans",Arial,sans-serif;
    display:flex; flex-direction:column; }
  .enamel{ position:absolute; inset:26px; border:2px solid rgba(245,158,27,.22); border-radius:44px; pointer-events:none; }
  .wm{ font-weight:800; letter-spacing:-1px; color:var(--paper); }
  .wm span{ color:var(--marigold); }
  .wm sup{ font-size:.46em; font-weight:800; }
  .kicker{ text-transform:uppercase; letter-spacing:.18em; color:rgba(244,243,239,.55); font-weight:700; }
  .voice{ position:relative; display:flex; align-items:center; justify-content:center; margin:0 auto; }
  .ring{ position:absolute; border-radius:50%; border:2px solid var(--marigold); }
  .r1{ opacity:.30; } .r2{ opacity:.5; }
  .dot{ border-radius:50%; background:var(--marigold); display:flex; align-items:flex-end; justify-content:center;
    box-shadow:0 18px 44px rgba(245,158,27,.42); }
  .bars{ display:flex; align-items:flex-end; }
  .bars i{ border-radius:6px; background:var(--petrol-deep); display:block; }
  .free{ display:inline-flex; align-items:center; gap:12px; align-self:center; border:2px solid var(--marigold);
    color:var(--marigold); border-radius:999px; font-weight:800; }
  .free::before{ content:"●"; font-size:.7em; }
  h1{ color:var(--paper); font-weight:800; line-height:1.04; letter-spacing:-1.5px; }
  h1 span{ color:var(--marigold); }
  .sub{ color:rgba(244,243,239,.72); font-weight:500; }
  .steps{ color:var(--paper); font-weight:700; }
  .steps b{ color:var(--marigold); font-weight:800; padding:0 .3em; }
  .cta{ background:var(--marigold); color:var(--petrol-deep); font-weight:800; border-radius:999px; align-self:center; }
  .langs{ color:rgba(244,243,239,.55); font-weight:600; }
  .soon{ color:var(--marigold); font-weight:700; opacity:.9; }
  .soon::before{ content:"+ "; }
  .check{ display:flex; align-items:center; gap:16px; color:var(--paper); font-weight:600; }
  .tick{ flex:none; background:var(--marigold); color:var(--petrol-deep); border-radius:50%;
    width:46px; height:46px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .split{ display:flex; width:100%; height:100%; }
  .split .left{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
    border-right:2px solid rgba(245,158,27,.18); }
  .split .right{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; text-align:left; }
  .qrcard{ background:#fff; border-radius:28px; align-self:center; display:flex; flex-direction:column; align-items:center; }
  .qrcard img{ display:block; }
  .qrcard .scan{ color:var(--petrol-deep); font-weight:800; }

    .frame{ width:1200px; height:630px; }</style></head><body>
    <div class="frame">
    <div class="split">
      <div class="left" style="width:452px">
        <div class="wm" style="font-size:46px">Bol<span>Dukaan</span><sup>™</sup></div>
        <div class="voice" style="width:156px;height:156px">
    <span class="ring r1" style="width:156px;height:156px"></span>
    <span class="ring r2" style="width:131px;height:131px"></span>
    <span class="dot" style="width:106px;height:106px;padding-bottom:30px">
      <span class="bars" style="height:41px;gap:5px">
        <i style="width:6px;height:16px"></i><i style="width:6px;height:33px"></i><i style="width:6px;height:23px"></i><i style="width:6px;height:38px"></i><i style="width:6px;height:18px"></i>
      </span>
    </span>
  </div>
      </div>
      <div class="right" style="padding:56px 62px; gap:20px">
        <div class="free" style="font-size:24px; padding:10px 24px; align-self:flex-start">बिलकुल मुफ़्त</div>
        <h1 style="font-size:58px">एक मिनट में <span>दुकान ऑनलाइन।</span></h1>
        <div class="steps" style="font-size:26px">बोलो <b>→</b> दुकान तैयार <b>→</b> WhatsApp शेयर</div>
        <div class="cta" style="font-size:30px; padding:18px 46px; align-self:flex-start">boldukaan.com</div>
        <div style="display:flex; flex-direction:column; align-items:flex-start; gap:6px;">
          <div class="langs" style="font-size:22px">हिंदी · ਪੰਜਾਬੀ · English</div>
          <div class="soon" style="font-size:20px">और भाषाएँ जल्द आ रही हैं</div>
        </div>
      </div>
    </div></div></body></html>
